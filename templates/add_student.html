<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h2>Add Student</h2>

    <form method="POST">

        <input type="text"
               name="sid"
               placeholder="Student ID"
               required>

        <input type="text"
               name="name"
               placeholder="Student Name"
               required>

        <input type="text"
               name="course"
               placeholder="Course"
               required>

        <button type="submit">
            Save Student
        </button>

    </form>

    <br>

    <a href="/">Back Home</a>

</div>

</body>
</html>
